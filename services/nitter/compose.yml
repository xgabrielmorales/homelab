services:
  nitter:
    image: zedeus/nitter:latest-arm64
    container_name: nitter
    restart: unless-stopped
    depends_on:
      - nitter-redis
    volumes:
      - ./nitter.conf:/src/nitter.conf:Z,ro
      - ./sessions.jsonl:/src/sessions.jsonl:Z,ro
    user: "998:998"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    expose:
      - "8080"
    healthcheck:
      test: wget -nv --tries=1 --spider http://127.0.0.1:8080/Jack/status/20 || exit 1
      interval: 30s
      timeout: 5s
      retries: 2
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nitter.rule=Host(`twitter.xgabrielmorales.com`)"
      - "traefik.http.routers.nitter.entrypoints=https"
      - "traefik.http.routers.nitter.tls=true"
      - "traefik.http.routers.nitter.tls.certresolver=cloudflare"
      - "traefik.http.services.nitter.loadbalancer.server.port=8080"

  nitter-redis:
    image: redis:6-alpine
    container_name: nitter-redis
    restart: unless-stopped
    volumes:
      - nitter-redis:/data
    user: "999:1000"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: redis-cli ping
      interval: 30s
      timeout: 5s
      retries: 2
    command: redis-server --save 60 1 --loglevel warning

volumes:
  nitter-redis:

networks:
  default:
    name: reverse-proxy
    external: true
