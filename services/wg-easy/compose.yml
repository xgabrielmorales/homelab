services:
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy
    container_name: wg-easy
    restart: on-failure:10
    env_file:
      - .env
    expose:
      - "51821:51821"
    ports:
      - "51820:51820/udp"
    volumes:
      - etc_wireguard:/etc/wireguard
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    networks:
      default:
      pihole:
        ipv4_address: 172.21.0.3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wireguard.rule=Host(`wireguard.xgabrielmorales.com`)"
      - "traefik.http.routers.wireguard.entrypoints=https"
      - "traefik.http.routers.wireguard.tls=true"
      - "traefik.http.routers.wireguard.tls.certresolver=cloudflare"
      - "traefik.http.services.wireguard.loadbalancer.server.port=51821"
      - "traefik.http.routers.wireguard.middlewares=tinyauth"

volumes:
  etc_wireguard:

networks:
  default:
    name: reverse-proxy
    external: true

  pihole:
    name: pihole
    external: true
