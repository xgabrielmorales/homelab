# vim: ft=yaml.docker-compose

services:
  dumb:
    image: ghcr.io/rramiachraf/dumb:latest
    hostname: dumb
    networks:
      - reverse-proxy-swarm
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == worker
      restart_policy:
        condition: any
        delay: 30s
        window: 120s
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.dumb.rule=Host(`dumb.xgabrielmorales.com`)"
        - "traefik.http.routers.dumb.entrypoints=websecure"
        - "traefik.http.routers.dumb.tls.certresolver=cloudflare"
        - "traefik.http.services.dumb.loadbalancer.server.port=5555"

networks:
  reverse-proxy-swarm:
    external: true
