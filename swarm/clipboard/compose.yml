# vim: ft=yaml.docker-compose

services:
  clipboard:
    image: git.xgabrielmorales.com/xgabrielmorales/clipboard:0.0.1@sha256:1f6da79df2cfda8dcd9d03baf84caa93c4f6e3d34de01ac0090d50ff8b7b72ad
    hostname: clipboard
    read_only: true
    cap_drop:
      - ALL
    networks:
      - reverse-proxy-swarm
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == worker
      restart_policy:
        condition: any
        delay: 30s
        window: 120s
      resources:
        limits:
          memory: 128M
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.text-sync.rule=Host(`clipboard.xgabrielmorales.com`)"
        - "traefik.http.routers.text-sync.entrypoints=websecure"
        - "traefik.http.routers.text-sync.tls.certresolver=cloudflare"
        - "traefik.http.services.text-sync.loadbalancer.server.port=3000"

networks:
  reverse-proxy-swarm:
    external: true
