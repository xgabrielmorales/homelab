# vim: ft=yaml.docker-compose

services:
  app:
    image: swarmpit/swarmpit:1.10@sha256:15c044a82feda149327822fc49e74a95d8f64da4c57aefe1781614f2e9c8830f
    hostname: swarmpit
    environment:
      - SWARMPIT_DB=http://couchdb:5984
      - SWARMPIT_INFLUXDB=http://influxdb:8086
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - reverse-proxy-swarm
      - swarmpit
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 60s
      timeout: 10s
      retries: 3
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
        delay: 30s
        window: 120s
      resources:
        limits:
          memory: 1G
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.swarmpit.rule=Host(`swarmpit.xgabrielmorales.com`)"
        - "traefik.http.routers.swarmpit.entrypoints=websecure"
        - "traefik.http.routers.swarmpit.tls.certresolver=cloudflare"
        - "traefik.http.services.swarmpit.loadbalancer.server.port=8080"

  couchdb:
    image: couchdb:2.3.1@sha256:30dc067ce470fd437f4074d41f150fa81c1ff9c923a371d38f155d1a36159f4e
    hostname: db
    volumes:
      - swarmpit-db-data:/opt/couchdb/data
    networks:
      - swarmpit
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == worker
      restart_policy:
        condition: any
        delay: 30s
        window: 120s
      resources:
        limits:
          memory: 256M

  influxdb:
    image: influxdb:1.12.4@sha256:edbe4351f42238b267a7231c258050b37b462e55930236c1144301a47740582b
    hostname: influxdb
    volumes:
      - swarmpit-influx-data:/var/lib/influxdb
    networks:
      - swarmpit
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == worker
      restart_policy:
        condition: any
        delay: 30s
        window: 120s
      resources:
        limits:
          memory: 512M

  agent:
    image: swarmpit/agent:2.2@sha256:3c7a3900425c2d86dba09e0483f667ca989052fddb6afe196e037688426e62ae
    environment:
      - DOCKER_API_VERSION=1.44
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - swarmpit
    deploy:
      mode: global
      restart_policy:
        condition: any
        delay: 30s
        window: 120s
      resources:
        limits:
          memory: 64M
      labels:
        swarmpit.agent.enabled: "true"

networks:
  reverse-proxy-swarm:
    external: true
  swarmpit:
    driver: overlay
    attachable: true

volumes:
  swarmpit-db-data:
  swarmpit-influx-data:
