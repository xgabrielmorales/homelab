services:
  infisical:
    image: infisical/infisical:latest-postgres
    hostname: infisical
    environment:
      - AUTH_SECRET=${AUTH_SECRET}
      - DB_CONNECTION_URI=${DB_CONNECTION_URI}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - NODE_ENV=${NODE_ENV}
      - REDIS_URL=${REDIS_URL}
      - SITE_URL=${SITE_URL}
    networks:
      - infisical-network
      - reverse-proxy-swarm
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.node.type == xgm-mini
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.infisical.rule=Host(`infisical.xgabrielmorales.com`)"
        - "traefik.http.routers.infisical.entrypoints=websecure"
        - "traefik.http.routers.infisical.tls.certresolver=cloudflare"
        - "traefik.http.services.infisical.loadbalancer.server.port=8080"

  infisical-redis:
    image: redis:8.2-m01-alpine3.22
    hostname: infisical-redis
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
    volumes:
      - infisical-redis-data:/data
    networks:
      - infisical-network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      start_period: 0s
      start_interval: 3s
      interval: 10s
      timeout: 5s
      retries: 5

  infisical-postgres:
    image: postgres:14-alpine
    hostname: infisical-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - infisical-postgres-data:/var/lib/postgresql/data
    networks:
      - infisical-network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.node.type == xgm-mini
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      start_period: 0s
      start_interval: 3s
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  infisical-postgres-data:
    driver: local
  infisical-redis-data:
    driver: local

networks:
  infisical-network:
    driver: overlay
    internal: true
  reverse-proxy-swarm:
    external: true
