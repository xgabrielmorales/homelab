# vim: ft=yaml.docker-compose

services:
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.4.2@sha256:1f3a6f303320723d199d2316a3e82b2e2685d86c275d5e3deeaf182573b47476
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    environment:
      CONTAINERS: "1"
      EVENTS: "1"
      IMAGES: "1"
      SERVICES: "1"
      TASKS: "1"
      NODES: "1"
      NETWORKS: "1"
      ALLOW_START: "0"
      ALLOW_STOP: "0"
      ALLOW_PRIVILEGED: "0"
    cap_drop:
      - ALL
    networks:
      - observability-internal
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 64M
      labels:
        - "traefik.enable=false"

  node-exporter:
    image: prom/node-exporter:v1.11.1@sha256:e9cff4fc67b1818f8c97adb115b9f12c9a54b533de86765d4a0effc01b357205
    hostname: "{{.Node.Hostname}}"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.rootfs=/rootfs
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    cap_drop:
      - ALL
    networks:
      - observability-internal
    deploy:
      mode: global
      restart_policy:
        condition: any
        delay: 30s
        window: 120s
      resources:
        limits:
          memory: 64M
      labels:
        - "prometheus.port=9100"

  prometheus:
    image: prom/prometheus:v3.12.0@sha256:69f5241418838263316593f7274a304b095c40bcf22e57272865da91bd60a8ac
    configs:
      - source: config-prometheus
        target: /etc/prometheus/prometheus.yml
    volumes:
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --log.level=debug
    cap_drop:
      - ALL
    networks:
      - observability-internal
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
        delay: 30s
        window: 120s
      resources:
        limits:
          memory: 256M
      labels:
        - "prometheus.port=9090"

  loki:
    image: grafana/loki:3.7.3@sha256:d14b3a2c419b72fe27cd094c017863bd37a5ea9ac7d72f35bcd25f5bd081dc47
    configs:
      - source: config-loki
        target: /etc/loki/config.yaml
    command: -config.file=/etc/loki/config.yaml
    volumes:
      - loki-data:/loki
    cap_drop:
      - ALL
    networks:
      - observability-internal
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
        delay: 30s
        window: 120s
      resources:
        limits:
          memory: 2GB
      labels:
        - "prometheus.port=3100"
        - "prometheus.path=/metrics"

  alloy:
    image: grafana/alloy:v1.17.1@sha256:4f6ddc56ffdcf8a6316748fc5162972e20cb301523cac1bb4a31957df733ae9b
    hostname: "{{.Node.Hostname}}"
    configs:
      - source: config-alloy
        target: /etc/alloy/config.alloy
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # NixOS pins the docker group to GID 131 on every host, so the alloy user
    # (uid 473 in the image) only needs that group to read the socket.
    user: "473:131"
    cap_drop:
      - ALL
    networks:
      - observability-internal
    deploy:
      mode: global
      restart_policy:
        condition: any
        delay: 30s
        window: 120s
      resources:
        limits:
          memory: 256M
      labels:
        - "prometheus.port=12345"

  grafana:
    image: grafana/grafana:13.0.1-security-01@sha256:2d1f9ae67c1778d33e291d4c3c759cd8b650e67491f02533499eb950e075eeb5
    environment:
      - GRAFANA_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GRAFANA_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GRAFANA_ADMIN_EMAIL=${GRAFANA_ADMIN_EMAIL}
      - GRAFANA_SECRET_KEY=${GRAFANA_SECRET_KEY}
    configs:
      - source: config-grafana
        target: /etc/grafana/grafana.ini
      - source: config-grafana-datasources
        target: /etc/grafana/provisioning/datasources/datasources.yaml
      - source: config-grafana-alerting
        target: /etc/grafana/provisioning/alerting/alerting.yaml
    volumes:
      - grafana-data:/var/lib/grafana
    cap_drop:
      - ALL
    networks:
      - observability-internal
      - reverse-proxy-swarm
    healthcheck:
      test: ["CMD-SHELL", "true"]
      interval: 30s
      timeout: 5s
      retries: 1
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: any
        delay: 30s
        window: 120s
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 512M
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.grafana.rule=Host(`grafana.xgabrielmorales.com`)"
        - "traefik.http.routers.grafana.entrypoints=websecure"
        - "traefik.http.routers.grafana.tls.certresolver=cloudflare"
        - "traefik.http.services.grafana.loadbalancer.server.port=3000"

configs:
  config-prometheus:
    file: ./config/config-prometheus.yaml
  config-grafana:
    file: ./config/config-grafana.ini
  config-grafana-datasources:
    file: ./config/config-grafana-datasources.yaml
  config-grafana-alerting:
    file: ./config/config-grafana-alerting.yaml
  config-loki:
    file: ./config/config-loki.yaml
  config-alloy:
    file: ./config/config-alloy.alloy

volumes:
  prometheus-data:
  grafana-data:
  loki-data:

networks:
  observability-internal:
    name: observability-internal
    internal: true
  reverse-proxy-swarm:
    external: true
