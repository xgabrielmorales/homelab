# vim: ft=yaml.docker-compose

services:
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.4.1@sha256:3400c429c5f9e1b21d62130fb93b16e2e772d4fb7695bd52fc2b743800b9fe9e
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    environment:
      NETWORKS: 1
      NODES: 1
      SERVICES: 1
      TASKS: 1
    networks:
      - reverse-proxy-swarm
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      labels:
        - "traefik.enable=false"

  node-exporter:
    image: prom/node-exporter:v1.9.1@sha256:d00a542e409ee618a4edc67da14dd48c5da66726bbd5537ab2af9c1dfc442c8a
    hostname: "{{.Node.Hostname}}"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.rootfs=/rootfs
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    networks:
      - reverse-proxy-swarm
    deploy:
      mode: global
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      labels:
        - "prometheus.port=9100"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.0@sha256:505e2c61e74e5d5eae522d01e2e971e91b793bc405270315a64da806ba033640
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - reverse-proxy-swarm
    deploy:
      mode: global
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      labels:
        - "prometheus.port=8080"

  prometheus:
    image: prom/prometheus:v3.7.3@sha256:49214755b6153f90a597adcbff0252cc61069f8ab69ce8411285cd4a560e8038
    configs:
      - source: config-prometheus
        target: /etc/prometheus/prometheus.yml
    volumes:
      - prometheus-data:/prometheus
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    networks:
      - reverse-proxy-swarm
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  grafana:
    image: grafana/grafana:12.3@sha256:70d9599b186ce287be0d2c5ba9a78acb2e86c1a68c9c41449454d0fc3eeb84e8
    environment:
      # Security configurations - Production hardening
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_SECURITY_ADMIN_EMAIL=${GRAFANA_ADMIN_EMAIL}
      - GF_SECURITY_SECRET_KEY=${GRAFANA_SECRET_KEY}
      - GF_SECURITY_COOKIE_SECURE=true
      - GF_SECURITY_COOKIE_SAMESITE=strict
      - GF_SECURITY_STRICT_TRANSPORT_SECURITY=true
      - GF_SECURITY_X_CONTENT_TYPE_OPTIONS=true
      - GF_SECURITY_X_XSS_PROTECTION=true
      - GF_SECURITY_DISABLE_BRUTE_FORCE_LOGIN_PROTECTION=false
      - GF_SECURITY_BRUTE_FORCE_LOGIN_PROTECTION_MAX_ATTEMPTS=3
      - GF_SECURITY_ALLOW_EMBEDDING=false
      - GF_SECURITY_DISABLE_GRAVATAR=true
      # Authentication settings
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_AUTH_BASIC_ENABLED=true
      - GF_AUTH_DISABLE_LOGIN_FORM=false
      - GF_AUTH_DISABLE_SIGNOUT_MENU=false
      # Server settings
      - GF_SERVER_PROTOCOL=http
      - GF_SERVER_DOMAIN=grafana.empresas.tusdatos.co
      - GF_SERVER_ROOT_URL=https://grafana.empresas.tusdatos.co/
      - GF_SERVER_SERVE_FROM_SUB_PATH=false
      - GF_SERVER_ENFORCE_DOMAIN=false
      # Database settings (use SQLite for simplicity)
      - GF_DATABASE_TYPE=sqlite3
      - GF_DATABASE_PATH=/var/lib/grafana/grafana.db
      # Analytics and telemetry (disabled for privacy)
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES=false
      - GF_NEWS_NEWS_FEED_ENABLED=false
      # Performance settings
      - GF_SNAPSHOTS_EXTERNAL_ENABLED=false
      - GF_ALERTING_ENABLED=false
      - GF_UNIFIED_ALERTING_ENABLED=true
      - GF_EXPLORE_ENABLED=true
      # Unified Alerting settings
      - GF_UNIFIED_ALERTING_SCREENSHOTS_CAPTURE=false
      - GF_UNIFIED_ALERTING_ADMIN_CONFIG_POLL_INTERVAL=60s
      - GF_UNIFIED_ALERTING_ALERTMANAGER_POLL_INTERVAL=60s
      # Session settings
      - GF_SESSION_PROVIDER=memory
      - GF_SESSION_COOKIE_NAME=grafana_sess
      - GF_SESSION_COOKIE_SECURE=true
      - GF_SESSION_SESSION_LIFE_TIME=3600 # 1 hours
      # Logging
      - GF_LOG_MODE=console
      - GF_LOG_LEVEL=info
      - GF_LOG_CONSOLE_FORMAT=json
    configs:
      - source: config-grafana
        target: /etc/grafana/provisioning/datasources/datasources.yaml
      - source: config-grafana-alerting
        target: /etc/grafana/provisioning/alerting/alerting.yaml
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - reverse-proxy-swarm
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.grafana.rule=Host(`grafana.xgabrielmorales.com`)"
        - "traefik.http.routers.grafana.entrypoints=websecure"
        - "traefik.http.routers.grafana.tls.certresolver=cloudflare"
        - "traefik.http.services.grafana.loadbalancer.server.port=3000"

configs:
  config-prometheus:
    file: ./config/config-prometheus.yaml
  config-grafana:
    file: ./config/config-grafana.yaml
  config-grafana-alerting:
    file: ./config/config-grafana-alerting.yaml

volumes:
  prometheus-data:
  grafana-data:

networks:
  reverse-proxy-swarm:
    external: true
