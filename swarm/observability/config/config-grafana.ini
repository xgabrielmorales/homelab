[security]
admin_user = $__env{GRAFANA_ADMIN_USER}
admin_password = $__env{GRAFANA_ADMIN_PASSWORD}
admin_email = $__env{GRAFANA_ADMIN_EMAIL}
secret_key = $__env{GRAFANA_SECRET_KEY}
cookie_secure = true
cookie_samesite = lax
strict_transport_security = true
x_content_type_options = true
x_xss_protection = true
disable_brute_force_login_protection = false
brute_force_login_protection_max_attempts = 3
allow_embedding = false
disable_gravatar = true

[auth.anonymous]
enabled = false

[server]
protocol = http
domain = grafana.xgabrielmorales.com
root_url = https://grafana.xgabrielmorales.com/
serve_from_sub_path = false
enforce_domain = false

[database]
type = sqlite3
path = /var/lib/grafana/grafana.db

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[plugins]
preinstall_disabled = true

[news]
news_feed_enabled = false

[snapshots]
external_enabled = false

[alerting]
enabled = false

[unified_alerting]
enabled = true
screenshots_capture = false
admin_config_poll_interval = 60s
alertmanager_poll_interval = 60s

[explore]
enabled = true

[session]
provider = memory
cookie_name = grafana_sess
cookie_secure = true
session_life_time = 3600

[log]
mode = console
level = info

[log.console]
format = json
