http:
  routers:
    k3s-catchall:
      rule: 'HostRegexp(`^.+\.xgabrielmorales\.com$`)'
      entryPoints:
        - websecure
      priority: 1
      service: k3s-traefik
      middlewares:
        - k3s-forward-proto
      tls:
        certResolver: cloudflare
        domains:
          - main: "*.xgabrielmorales.com"
  services:
    k3s-traefik:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: "http://10.10.10.3:8000"
  middlewares:
    k3s-forward-proto:
      headers:
        customRequestHeaders:
          X-Forwarded-Proto: https
