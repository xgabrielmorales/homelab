# vim: ft=yaml.docker-compose

services:
  traefik:
    image: traefik:latest
    hostname: traefik
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - traefik-certs:/certs
      - traefik-logs:/var/log/traefik
    environment:
      - CF_DNS_API_TOKEN=${TFK_CF_DNS_API_TOKEN}
      - TZ=${TFK_TZ}
    command:
      # API and Dashboard
      - "--api=true"
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--api.debug=false"
      # Entrypoints
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
      - "--entrypoints.websecure.address=:443"
      # Providers
      - "--providers.swarm=true"
      - "--providers.swarm.exposedbydefault=false"
      - "--providers.swarm.network=reverse-proxy-swarm"
      # Plugin configuration
      - "--experimental.plugins.crowdsec-bouncer.modulename=github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin"
      - "--experimental.plugins.crowdsec-bouncer.version=v1.3.4"
      # Certificates ACME with Cloudflare
      - "--certificatesresolvers.cloudflare.acme.email=${TFK_ACME_EMAIL}"
      - "--certificatesresolvers.cloudflare.acme.storage=/certs/acme.json"
      - "--certificatesresolvers.cloudflare.acme.dnschallenge=true"
      - "--certificatesresolvers.cloudflare.acme.dnschallenge.provider=cloudflare"
      - "--certificatesresolvers.cloudflare.acme.dnschallenge.resolvers=1.1.1.1:53,1.0.0.1:53"
      # Logging
      - "--accesslog=true"
      - "--accessLog.filePath=/var/log/traefik/access.log"
      - "--accessLog.bufferingSize=100"
      - "--accessLog.filters.statusCodes=204-299,400-499,500-599"
      - "--global.sendAnonymousUsage=false"
      - "--log.level=INFO"
      - "--ping"
    healthcheck:
      test: [ "CMD", "traefik", "healthcheck", "--ping" ]
      start_period: 5s
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - reverse-proxy-swarm
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 30s
        max_attempts: 10
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.traefik.rule=Host(`traefik.xgabrielmorales.com`)"
        - "traefik.http.routers.traefik.entrypoints=websecure"
        - "traefik.http.routers.traefik.tls.certresolver=cloudflare"
        - "traefik.http.routers.traefik.service=api@internal"
        - "traefik.http.services.traefik.loadbalancer.server.port=8080"
        - "traefik.http.routers.traefik.middlewares=tinyauth"
        - "traefik.http.middlewares.crowdsec-bouncer.plugin.crowdsec-bouncer.enabled=true"
        - "traefik.http.middlewares.crowdsec-bouncer.plugin.crowdsec-bouncer.crowdseclapikey=${CROWDSEC_LAPI_KEY}"
        - "traefik.http.middlewares.crowdsec-bouncer.plugin.crowdsec-bouncer.crowdseclapiurl=http://crowdsec:8080/"

  crowdsec:
    image: crowdsecurity/crowdsec:latest
    container_name: crowdsec
    environment:
      COLLECTIONS: "crowdsecurity/traefik crowdsecurity/http-cve crowdsecurity/http-dos"
      CUSTOM_HOSTNAME: crowdsec
      BOUNCER_KEY_traefik: ${CROWDSEC_LAPI_KEY}
    configs:
      - source: crowdsec-acquis
        target: /etc/crowdsec/acquis.yaml
    volumes:
      - traefik-logs:/var/log/traefik:ro
      - crowdsec-config:/etc/crowdsec/
      - type: tmpfs
        target: /var/lib/crowdsec/data/
        tmpfs:
          size: 524288000 # 500 MB
    networks:
      - reverse-proxy-swarm
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 30s
        max_attempts: 10
      labels:
        - "traefik.enable=false"

  tinyauth:
    image: ghcr.io/steveiliop56/tinyauth:v3
    hostname: tinyauth
    environment:
      - APP_TITLE=${TA_APP_TITLE}
      - APP_URL=https://auth.xgabrielmorales.com
      - COOKIE_SECURE=${TA_COOKIE_SECURE:-true}
      - DISABLE_CONTINUE=${TA_DISABLE_CONTINUE:-true}
      - LOG_LEVEL=${TA_LOG_LEVEL:-0}
      - SECRET=${TA_SECRET}
      - USERS=${TA_USERS}
    healthcheck:
      test: [ "CMD", "curl", "--fail", "--head", "http://localhost:3000/" ]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - reverse-proxy-swarm
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.tinyauth.rule=Host(`auth.xgabrielmorales.com`)"
        - "traefik.http.routers.tinyauth.entrypoints=websecure"
        - "traefik.http.routers.tinyauth.tls.certresolver=cloudflare"
        - "traefik.http.routers.tinyauth.middlewares=crowdsec-bouncer"
        - "traefik.http.services.tinyauth.loadbalancer.server.port=3000"
        - "traefik.http.middlewares.tinyauth.forwardauth.address=http://tinyauth:3000/api/auth/traefik"

volumes:
  traefik-certs:
  traefik-logs:
  crowdsec-config:


configs:
  crowdsec-acquis:
    file: ./config/crowdsec/acquis.yaml

networks:
  reverse-proxy-swarm:
    external: true
