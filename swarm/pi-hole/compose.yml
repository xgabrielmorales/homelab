# vim: ft=yaml.docker-compose

services:
  pihole:
    image: pihole/pihole:latest
    hostname: pihole
    ports:
      - "53:53/tcp"
      - "53:53/udp"
    volumes:
      - etc-pihole:/etc/pihole
    environment:
      - TZ=America/Bogota
      - ServerIP=pihole
      - DNS1=unbound
      - DNS2=unbound
      - PIHOLE_DNS=unbound
      - WEBPASSWORD=${PIH_WEBPASSWORD}
    networks:
      - reverse-proxy-swarm
    healthcheck:
      test: [ "CMD-SHELL", "dig +short +norecurse +retry=0 @127.0.0.1 pi.hole" ]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
        delay: 30s
        window: 120s
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.pihole.rule=Host(`pihole.xgabrielmorales.com`)"
        - "traefik.http.routers.pihole.entrypoints=websecure"
        - "traefik.http.routers.pihole.tls.certresolver=cloudflare"
        - "traefik.http.services.pihole.loadbalancer.server.port=80"

  unbound:
    image: klutchell/unbound:latest
    hostname: unbound
    healthcheck:
      test: [ "CMD", "drill", "@127.0.0.1", "dnssec.works" ]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
        delay: 30s
        window: 120s

volumes:
  etc-wireguard:
    driver: local
  etc-pihole:
    driver: local

networks:
  reverse-proxy-swarm:
    external: true
