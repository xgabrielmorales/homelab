# vim: ft=yaml.docker-compose

services:
  pairdrop:
    image: lscr.io/linuxserver/pairdrop:latest
    hostname: pairdrop
    environment:
      - DEBUG_MODE=${DEBUG_MODE}
      - PGID=${PGID}
      - PUID=${PUID}
      - RATE_LIMIT=${RATE_LIMIT}
      - RTC_CONFIG=${RTC_CONFIG}
      - TZ=${TZ}
      - WS_FALLBACK=${WS_FALLBACK}
    networks:
      - reverse-proxy-swarm
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000"]
      interval: 2s
      timeout: 10s
      retries: 15
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.node.type == xgm-mini
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.pairdrop.rule=Host(`pairdrop.xgabrielmorales.com`)"
        - "traefik.http.routers.pairdrop.entrypoints=websecure"
        - "traefik.http.routers.pairdrop.tls.certresolver=cloudflare"
        - "traefik.http.services.pairdrop.loadbalancer.server.port=3000"

networks:
  reverse-proxy-swarm:
    external: true
