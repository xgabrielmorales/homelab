# vim: ft=yaml.docker-compose

services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:15-rootless@sha256:cc2d74fb4c30385a8ee34de8c8f83344f7316cec70bd2cc7eb82b2802fa28e0b
    hostname: forgejo
    user: 1000:1000
    ports:
      - "2222:2222"
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - FORGEJO____APP_SLOGAN=${FORGEJO____APP_SLOGAN}
      - FORGEJO__database__DB_TYPE=postgres
      - FORGEJO__database__HOST=forgejo-db:5432
      - FORGEJO__database__NAME=${POSTGRES_DATABASE}
      - FORGEJO__database__PASSWD=${POSTGRES_PASSWORD}
      - FORGEJO__database__USER=${POSTGRES_USER}
      - FORGEJO__lfs__JWT_SECRET=${FORGEJO__lfs__JWT_SECRET}
      - FORGEJO__openid__ENABLE_OPENID_SIGNIN=${FORGEJO__openid__ENABLE_OPENID_SIGNIN}
      - FORGEJO__openid__ENABLE_OPENID_SIGNUP=${FORGEJO__openid__ENABLE_OPENID_SIGNUP}
      - FORGEJO__repository__DEFAULT_PRIVATE=${FORGEJO__repository__DEFAULT_PRIVATE}
      - FORGEJO__repository__DISABLED_REPO_UNITS=${FORGEJO__repository__DISABLED_REPO_UNITS}
      - FORGEJO__repository__DISABLE_FORKS=${FORGEJO__repository__DISABLE_FORKS}
      - FORGEJO__repository__DISABLE_STARS=${FORGEJO__repository__DISABLE_STARS}
      - FORGEJO__security__INTERNAL_TOKEN=${FORGEJO__security__INTERNAL_TOKEN}
      - FORGEJO__security__JWT_SECRET=${FORGEJO__security__JWT_SECRET}
      - FORGEJO__security__SECRET_KEY=${FORGEJO__security__SECRET_KEY}
      - FORGEJO__server__LANDING_PAGE=${FORGEJO__server__LANDING_PAGE}
      - FORGEJO__server__SSH_PORT=${FORGEJO__server__SSH_PORT}
      - FORGEJO__service__ALLOW_ONLY_INTERNAL_REGISTRATION=${FORGEJO__service__ALLOW_ONLY_INTERNAL_REGISTRATION}
      - FORGEJO__service__DISABLE_REGISTRATION=${FORGEJO__service__DISABLE_REGISTRATION}
      - FORGEJO__service__LOGIN_REMEMBER_DAYS=${FORGEJO__service__LOGIN_REMEMBER_DAYS}
      - FORGEJO__service__SHOW_MILESTONES_DASHBOARD_PAGE=${FORGEJO__service__SHOW_MILESTONES_DASHBOARD_PAGE}
      - FORGEJO__ui__SHOW_USER_EMAIL=${FORGEJO__ui__SHOW_USER_EMAIL}
      - FORGEJO__ui__THEMES=${FORGEJO__ui__THEMES}
    volumes:
      - forgejo-data:/var/lib/gitea
      - /etc/localtime:/etc/localtime:ro
    networks:
      - reverse-proxy-swarm
      - forgejo-internal
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
        delay: 30s
        window: 120s
      resources:
        limits:
          memory: 1G
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.forgejo.rule=Host(`git.xgabrielmorales.com`)"
        - "traefik.http.routers.forgejo.entrypoints=websecure"
        - "traefik.http.routers.forgejo.tls.certresolver=cloudflare"
        - "traefik.http.services.forgejo.loadbalancer.server.port=3000"

  forgejo-db:
    image: postgres:17@sha256:7ad98329d513dd497293b951c195ca354274a77f12ddbbbbf85e68a811823d72
    hostname: forgejo-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DATABASE}
    volumes:
      - forgejo-db-data:/var/lib/postgresql/data
    networks:
      - forgejo-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      start_period: 0s
      start_interval: 3s
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == worker
      restart_policy:
        condition: any
        delay: 30s
        window: 120s
      resources:
        limits:
          memory: 1G

volumes:
  forgejo-data:
    driver: local
  forgejo-db-data:
    driver: local

networks:
  reverse-proxy-swarm:
    external: true
  forgejo-internal:
    internal: true
