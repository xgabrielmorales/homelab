services:
  wireguard:
    image: ghcr.io/wg-easy/wg-easy:15.2.2@sha256:cf815209439101842f81d62bb25f7d66140e4cf8c100b4de5d0e84569d38732a
    hostname: wireguard
    ports:
      - target: 51820
        published: 51820
        protocol: udp
        mode: host
    volumes:
      - "/lib/modules:/lib/modules:ro"
      - wireguard-etc:/etc/wireguard
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
      - NET_RAW
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    networks:
      reverse-proxy-swarm:
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
        delay: 30s
        window: 120s
      resources:
        limits:
          memory: 128M
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.wireguard.rule=Host(`wg.xgabrielmorales.com`)"
        - "traefik.http.routers.wireguard.entrypoints=websecure"
        - "traefik.http.routers.wireguard.tls.certresolver=cloudflare"
        - "traefik.http.services.wireguard.loadbalancer.server.port=51821"

networks:
  reverse-proxy-swarm:
    external: true

volumes:
  wireguard-etc:
