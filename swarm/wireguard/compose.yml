services:
  wireguard:
    image: ghcr.io/wg-easy/wg-easy:15.3.0@sha256:93bbd593e07bab98d02807a28770ac87ab6c48818e319e68c1f66561feb99876
    hostname: wireguard
    # The image pins iptables to the legacy backend, but the NixOS host kernel
    # only ships nftables (no iptable_nat module), so wg-quick's nat rules fail.
    # Repoint iptables to the nft backend, then run the original CMD.
    entrypoint:
      - /bin/sh
      - -c
      - |
        ln -sf /usr/sbin/iptables-nft /usr/sbin/iptables
        ln -sf /usr/sbin/ip6tables-nft /usr/sbin/ip6tables
        exec /usr/bin/dumb-init node server/index.mjs
    ports:
      - target: 51820
        published: 51820
        protocol: udp
        mode: host
    volumes:
      - "/lib/modules:/lib/modules:ro"
      - wireguard-etc:/etc/wireguard
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
      - NET_RAW
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    networks:
      reverse-proxy-swarm:
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
        delay: 30s
        window: 120s
      resources:
        limits:
          memory: 128M
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.wireguard.rule=Host(`wg.xgabrielmorales.com`)"
        - "traefik.http.routers.wireguard.entrypoints=websecure"
        - "traefik.http.routers.wireguard.tls.certresolver=cloudflare"
        - "traefik.http.services.wireguard.loadbalancer.server.port=51821"

networks:
  reverse-proxy-swarm:
    external: true

volumes:
  wireguard-etc:
