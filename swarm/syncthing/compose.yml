# vim: ft=yaml.docker-compose

services:
  syncthing:
    image: syncthing/syncthing:2.0.16@sha256:4a961394ca471f4e48f31ad2cef50697e502c8799e2e98477a1c3844e0c5bc54
    hostname: syncthing
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Bogota
    volumes:
      - syncthing-config:/config
    ports:
      - "8384:8384"
      - "22000:22000/tcp"
      - "22000:22000/udp"
      - "21027:21027/udp"
    networks:
      - reverse-proxy-swarm
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8384/"]
      interval: 5s
      timeout: 20s
      retries: 10
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == worker
      restart_policy:
        condition: any
        delay: 30s
        window: 120s
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.syncthing.rule=Host(`syncthing.xgabrielmorales.com`)"
        - "traefik.http.routers.syncthing.entrypoints=websecure"
        - "traefik.http.routers.syncthing.tls.certresolver=cloudflare"
        - "traefik.http.services.syncthing.loadbalancer.server.port=8384"

volumes:
  syncthing-config:
    driver: local

networks:
  reverse-proxy-swarm:
    external: true
