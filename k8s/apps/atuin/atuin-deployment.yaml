apiVersion: apps/v1
kind: Deployment
metadata:
  name: atuin
  labels:
    app: atuin
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: atuin
  template:
    metadata:
      labels:
        app: atuin
    spec:
      nodeSelector:
        kubernetes.io/hostname: xgm-hm
      enableServiceLinks: false
      containers:
        - name: atuin
          image: ghcr.io/atuinsh/atuin:18.24.3@sha256:aed6e5efed2b5b6a7d5e5d77e07b122613ea1cafe65f9f7e0193a4ef760961ba
          args: ["start"]
          ports:
            - containerPort: 8888
          env:
            - name: TZ
              value: America/Bogota
            - name: ATUIN_HOST
              value: "0.0.0.0"
            - name: ATUIN_PORT
              value: "8888"
            - name: ATUIN_OPEN_REGISTRATION
              value: "false"
            - name: ATUIN_DB_URI
              valueFrom:
                secretKeyRef:
                  name: atuin
                  key: ATUIN_DB_URI
          resources:
            requests:
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          emptyDir: {}
