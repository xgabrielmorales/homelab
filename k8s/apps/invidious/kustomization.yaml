apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: default
resources:
  - companion-deployment.yaml
  - companion-ingress.yaml
  - companion-service.yaml
  - db-deployment.yaml
  - db-pvc.yaml
  - db-service.yaml
  - invidious-deployment.yaml
  - invidious-ingress.yaml
  - invidious-secret.sops.yaml
  - invidious-service.yaml
configMapGenerator:
  - name: invidious-initdb
    files:
      - files/init-invidious-db.sh
  - name: invidious-sql
    files:
      - files/sql/channels.sql
      - files/sql/videos.sql
      - files/sql/channel_videos.sql
      - files/sql/users.sql
      - files/sql/session_ids.sql
      - files/sql/nonces.sql
      - files/sql/annotations.sql
      - files/sql/playlists.sql
      - files/sql/playlist_videos.sql
