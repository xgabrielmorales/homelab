apiVersion: apps/v1
kind: Deployment
metadata:
  name: invidious
  labels:
    app: invidious
spec:
  replicas: 1
  selector:
    matchLabels:
      app: invidious
  template:
    metadata:
      labels:
        app: invidious
    spec:
      nodeSelector:
        kubernetes.io/hostname: xgm-hm
      enableServiceLinks: false
      containers:
        - name: invidious
          image: quay.io/invidious/invidious:2026.10.31-9f0b4c8@sha256:31013a8f3a6fa269e03493734fb6982181b020fda51808c6c2f4d39293cf6534
          ports:
            - containerPort: 3000
          env:
            - name: TZ
              value: America/Bogota
            - name: INVIDIOUS_CONFIG
              valueFrom:
                secretKeyRef:
                  name: invidious
                  key: INVIDIOUS_CONFIG
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
