apiVersion: apps/v1
kind: Deployment
metadata:
  name: invidious-db
  labels:
    app: invidious-db
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: invidious-db
  template:
    metadata:
      labels:
        app: invidious-db
    spec:
      nodeSelector:
        kubernetes.io/hostname: xgm-hm
      enableServiceLinks: false
      containers:
        - name: postgres
          image: postgres:18@sha256:b9f6b8ff03b62f3cfd9d9ba3fe56226a9991c79d3fb46fd46536263bf02be553
          ports:
            - containerPort: 5432
          env:
            - name: TZ
              value: America/Bogota
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: invidious
                  key: INVIDIOUS_DB_DBNAME
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: invidious
                  key: INVIDIOUS_DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: invidious
                  key: INVIDIOUS_DB_PASSWORD
          resources:
            requests:
              memory: 96Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
                - SETUID
                - SETGID
            seccompProfile:
              type: RuntimeDefault
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
            - name: sql
              mountPath: /config/sql
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: invidious-db-data-pg18
        - name: initdb
          configMap:
            name: invidious-initdb
            defaultMode: 0755
        - name: sql
          configMap:
            name: invidious-sql
