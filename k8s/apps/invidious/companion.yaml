apiVersion: apps/v1
kind: Deployment
metadata:
  name: invidious-companion
  labels:
    app: invidious-companion
spec:
  replicas: 1
  selector:
    matchLabels:
      app: invidious-companion
  template:
    metadata:
      labels:
        app: invidious-companion
    spec:
      containers:
        - name: companion
          image: quay.io/invidious/invidious-companion:2026.09.19-bb3b37f@sha256:f15bc688aedd4bbb76cc636c7cc0cfff9b2b9f0734a4b831efbda7253b180525
          ports:
            - containerPort: 8282
          env:
            - name: TZ
              value: America/Bogota
            - name: SERVER_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: invidious
                  key: INVIDIOUS_INVIDIOUS_COMPANION_KEY
          resources:
            requests:
              memory: 192Mi
            limits:
              memory: 640Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: cache
              mountPath: /var/tmp/youtubei.js
      volumes:
        - name: cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: invidious-companion
spec:
  selector:
    app: invidious-companion
  ports:
    - port: 8282
      targetPort: 8282
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: invidious-companion
spec:
  ingressClassName: traefik
  rules:
    - host: companion.xgabrielmorales.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: invidious-companion
                port:
                  number: 8282
