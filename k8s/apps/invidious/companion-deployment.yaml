apiVersion: apps/v1
kind: Deployment
metadata:
  name: invidious-companion
  labels:
    app: invidious-companion
spec:
  replicas: 1
  selector:
    matchLabels:
      app: invidious-companion
  template:
    metadata:
      labels:
        app: invidious-companion
    spec:
      nodeSelector:
        kubernetes.io/hostname: xgm-hm
      enableServiceLinks: false
      containers:
        - name: companion
          image: quay.io/invidious/invidious-companion:2026.10.18-fcb0456@sha256:5642790b67c2ce655a630dbff1342051bd98674abc8e469551117a3d4b6bedcc
          ports:
            - containerPort: 8282
          env:
            - name: TZ
              value: America/Bogota
            - name: SERVER_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: invidious
                  key: INVIDIOUS_INVIDIOUS_COMPANION_KEY
          resources:
            requests:
              memory: 192Mi
            limits:
              memory: 640Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: cache
              mountPath: /var/tmp/youtubei.js
      volumes:
        - name: cache
          emptyDir: {}
