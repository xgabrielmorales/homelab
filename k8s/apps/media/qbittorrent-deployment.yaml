apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  labels:
    app: qbittorrent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qbittorrent
  template:
    metadata:
      labels:
        app: qbittorrent
    spec:
      nodeSelector:
        kubernetes.io/hostname: xgm-hm
      enableServiceLinks: false
      initContainers:
        - name: seed-conf
          image: busybox:1.38@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
            seccompProfile:
              type: RuntimeDefault
          command:
            - sh
            - -c
            - >-
              mkdir -p /config/qBittorrent &&
              rm -f /config/qBittorrent/qBittorrent_new.conf &&
              cp /conf/qBittorrent.conf /config/qBittorrent/qBittorrent.conf &&
              chown 1000:1000 /config/qBittorrent/qBittorrent.conf
          volumeMounts:
            - name: config
              mountPath: /config
            - name: conf
              mountPath: /conf
      containers:
        - name: qbittorrent
          image: linuxserver/qbittorrent:5.3.0@sha256:3d4c4545d51a690a0df15a2ff99038823a88a9822df8e794526447b9afbd7384
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: America/Bogota
          ports:
            - name: webui
              containerPort: 8080
            - name: bt-tcp
              containerPort: 6881
              hostPort: 6881
              protocol: TCP
            - name: bt-udp
              containerPort: 6881
              hostPort: 6881
              protocol: UDP
          resources:
            requests:
              memory: 64Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
                - SETUID
                - SETGID
                - KILL
          volumeMounts:
            - name: config
              mountPath: /config
            - name: downloads
              mountPath: /downloads
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: qbittorrent-config
        - name: downloads
          persistentVolumeClaim:
            claimName: media-downloads
        - name: conf
          secret:
            secretName: qbittorrent-conf
