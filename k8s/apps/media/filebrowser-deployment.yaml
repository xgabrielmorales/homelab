apiVersion: apps/v1
kind: Deployment
metadata:
  name: filebrowser
  labels:
    app: filebrowser
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: filebrowser
  template:
    metadata:
      labels:
        app: filebrowser
    spec:
      nodeSelector:
      containers:
        - name: filebrowser
          image: gtstef/filebrowser:2.0.1-stable@sha256:2e3936caf7b12908f7d3ebb68ddfcea075cda5f732e4bd95beae6cfa529cbec7
          env:
            - name: FILEBROWSER_CONFIG
              value: /config/filebrowser.yaml
            - name: TZ
              value: America/Bogota
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              memory: 48Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
          volumeMounts:
            - name: data
              mountPath: /srv
            - name: database
              mountPath: /database
            - name: config
              mountPath: /config
            - name: downloads
              mountPath: /srv/downloads
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: filebrowser-data
        - name: database
          persistentVolumeClaim:
            claimName: filebrowser-database
        - name: config
          configMap:
            name: filebrowser-conf
        - name: downloads
          persistentVolumeClaim:
            claimName: media-downloads
