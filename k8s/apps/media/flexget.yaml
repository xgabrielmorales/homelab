apiVersion: apps/v1
kind: Deployment
metadata:
  name: flexget
  labels:
    app: flexget
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: flexget
  template:
    metadata:
      labels:
        app: flexget
    spec:
      nodeSelector:
        kubernetes.io/hostname: xgm-hm
      containers:
        - name: flexget
          image: wiserain/flexget:3.19.28@sha256:00eb21598d3c50024a465502a9c1e9c8126e5a706e20283d7f200bf8da13f06c
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: America/Bogota
            - name: TORRENT_PLUGIN
              value: qbittorrent
            - name: FG_WEBUI_PASSWD
              value: ""
          resources:
            requests:
              memory: 224Mi
            limits:
              memory: 384Mi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data
            - name: conf
              mountPath: /config/config.yml
              subPath: config.yml
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: flexget-config
        - name: data
          persistentVolumeClaim:
            claimName: media-downloads
        - name: conf
          configMap:
            name: flexget-conf
