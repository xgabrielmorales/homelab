apiVersion: apps/v1
kind: Deployment
metadata:
  name: flexget
  labels:
    app: flexget
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: flexget
  template:
    metadata:
      labels:
        app: flexget
    spec:
      nodeSelector:
        kubernetes.io/hostname: xgm-hm
      enableServiceLinks: false
      containers:
        - name: flexget
          image: wiserain/flexget:3.22.4@sha256:04d069cfeb237e024782c7c6a00d9eadb10f6c7c47004286199bd8fe6abd9c1e
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: America/Bogota
            - name: TORRENT_PLUGIN
              value: qbittorrent
          resources:
            requests:
              memory: 224Mi
            limits:
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
                - SETUID
                - SETGID
                - KILL
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data
            - name: conf
              mountPath: /config/config.yml
              subPath: config.yml
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: flexget-config
        - name: data
          persistentVolumeClaim:
            claimName: media-downloads
        - name: conf
          configMap:
            name: flexget-conf
