apiVersion: apps/v1
kind: Deployment
metadata:
  name: filebrowser
  labels:
    app: filebrowser
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: filebrowser
  template:
    metadata:
      labels:
        app: filebrowser
    spec:
      nodeSelector:
        kubernetes.io/hostname: xgm-hm
      containers:
        - name: filebrowser
          image: filebrowser/filebrowser:v2-s6@sha256:ee4ac79e52966a5f6247f99c7d667c1debfb277a3a61ab829f505aa8f4c74b21
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: America/Bogota
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              memory: 48Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: data
              mountPath: /srv
            - name: database
              mountPath: /database
            - name: config
              mountPath: /config
            - name: downloads
              mountPath: /srv/downloads
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: filebrowser-data
        - name: database
          persistentVolumeClaim:
            claimName: filebrowser-database
        - name: config
          persistentVolumeClaim:
            claimName: filebrowser-config
        - name: downloads
          persistentVolumeClaim:
            claimName: media-downloads
---
apiVersion: v1
kind: Service
metadata:
  name: filebrowser
spec:
  selector:
    app: filebrowser
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: filebrowser
spec:
  ingressClassName: traefik
  rules:
    - host: filebrowser.xgabrielmorales.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: filebrowser
                port:
                  number: 80
