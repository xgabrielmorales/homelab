apiVersion: apps/v1
kind: Deployment
metadata:
  name: playit
  labels:
    app: playit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: playit
  template:
    metadata:
      labels:
        app: playit
    spec:
      nodeSelector:
        kubernetes.io/hostname: xgm-hm
      enableServiceLinks: false
      containers:
        - name: playit
          image: ghcr.io/playit-cloud/playit-agent:1.1.0@sha256:fa2a6c58815582371fe046f0bd8bea6a39a8684711594a9d2dbe03e44df1fa2c
          env:
            - name: TZ
              value: America/Bogota
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: playit
                  key: SECRET_KEY
          resources:
            requests:
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
