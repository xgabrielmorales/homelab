apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fusion
spec:
  ingressClassName: traefik
  rules:
    - host: fusion.xgabrielmorales.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fusion
                port:
                  number: 8080
