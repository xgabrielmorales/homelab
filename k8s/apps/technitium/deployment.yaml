apiVersion: apps/v1
kind: Deployment
metadata:
  name: technitium
  labels:
    app: technitium
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: technitium
  template:
    metadata:
      labels:
        app: technitium
    spec:
      nodeSelector:
        kubernetes.io/hostname: xgm-hm
      securityContext:
        sysctls:
          - name: net.ipv4.ip_local_port_range
            value: "1024 65535"
      containers:
        - name: technitium
          image: technitium/dns-server:15.2.0@sha256:23d3b63d959e997800b095fe93009b3fae271b5258234ff2ade8535cb33682c8
          env:
            - name: TZ
              value: America/Bogota
          envFrom:
            - secretRef:
                name: technitium
          ports:
            - name: dns-udp
              containerPort: 53
              hostPort: 53
              protocol: UDP
            - name: dns-tcp
              containerPort: 53
              hostPort: 53
              protocol: TCP
            - name: webui
              containerPort: 5380
          securityContext:
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
          resources:
            requests:
              memory: 320Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/dns
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: technitium-config
---
apiVersion: v1
kind: Service
metadata:
  name: technitium
spec:
  selector:
    app: technitium
  ports:
    - port: 5380
      targetPort: 5380
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: technitium
spec:
  ingressClassName: traefik
  rules:
    - host: technitium.xgabrielmorales.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: technitium
                port:
                  number: 5380
