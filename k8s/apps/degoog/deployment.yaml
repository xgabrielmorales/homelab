apiVersion: apps/v1
kind: Deployment
metadata:
  name: degoog
  labels:
    app: degoog
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: degoog
  template:
    metadata:
      labels:
        app: degoog
    spec:
      containers:
        - name: degoog
          image: ghcr.io/degoog-org/degoog:1.1.0@sha256:3c9c1a4fd0bb6a85ce42478fbd2847f4c9763117f9d8fb1fad77b2eb16ace0f9
          ports:
            - containerPort: 4444
          env:
            - name: TZ
              value: America/Bogota
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
          envFrom:
            - secretRef:
                name: degoog
          resources:
            requests:
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - SETUID
                - SETGID
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: degoog-data
