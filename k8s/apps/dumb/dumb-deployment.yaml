apiVersion: apps/v1
kind: Deployment
metadata:
  name: dumb
  labels:
    app: dumb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dumb
  template:
    metadata:
      labels:
        app: dumb
    spec:
      nodeSelector:
        kubernetes.io/hostname: xgm-hm
      enableServiceLinks: false
      containers:
        - name: dumb
          image: ghcr.io/rramiachraf/dumb:latest@sha256:46dd926700f7922ac603d4973f4461cddadb1a79ae8a324ad54326a6b2c9be98
          ports:
            - containerPort: 5555
          env:
            - name: TZ
              value: America/Bogota
          resources:
            requests:
              memory: 96Mi
            limits:
              memory: 160Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
