apiVersion: apps/v1
kind: Deployment
metadata:
  name: wireguard
  labels:
    app: wireguard
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: wireguard
  template:
    metadata:
      labels:
        app: wireguard
    spec:
      nodeSelector:
        kubernetes.io/hostname: xgm-hm
      enableServiceLinks: false
      containers:
        - name: wireguard
          image: ghcr.io/wg-easy/wg-easy:15.5.0@sha256:071f79a639e9361123a5e57733107320207b844ddbbd92dfa6962f541fe8aac8
          command:
            - /bin/sh
            - -c
            - |
              ln -sf /usr/sbin/iptables-nft /usr/sbin/iptables
              ln -sf /usr/sbin/ip6tables-nft /usr/sbin/ip6tables
              exec /usr/bin/dumb-init node server/index.mjs
          env:
            - name: TZ
              value: America/Bogota
          envFrom:
            - secretRef:
                name: wireguard
          ports:
            - name: wg
              containerPort: 51820
              hostPort: 51820
              protocol: UDP
            - name: ui
              containerPort: 51821
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_ADMIN
                - NET_RAW
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              memory: 96Mi
            limits:
              memory: 160Mi
          volumeMounts:
            - name: etc
              mountPath: /etc/wireguard
      volumes:
        - name: etc
          persistentVolumeClaim:
            claimName: wireguard-data
