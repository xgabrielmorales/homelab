apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gotify
spec:
  ingressClassName: traefik
  rules:
    - host: gotify.xgabrielmorales.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gotify
                port:
                  number: 8080
