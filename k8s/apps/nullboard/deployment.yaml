apiVersion: apps/v1
kind: Deployment
metadata:
  name: nullboard
  labels:
    app: nullboard
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nullboard
  template:
    metadata:
      labels:
        app: nullboard
    spec:
      containers:
        - name: nullboard
          image: git.xgabrielmorales.com/xgabrielmorales/nullboard:0.0.2@sha256:fddfeb665e2b55fa9b7e8c41607c96849ae1a14de01b3ff54934fb798e0f1470
          ports:
            - containerPort: 8080
          env:
            - name: TZ
              value: America/Bogota
            - name: NB_DB
              value: /data/nullboard.db
          resources:
            requests:
              memory: 48Mi
            limits:
              memory: 128Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: nullboard-data
