apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: firefly-iii
  namespace: default
spec:
  interval: 1h
  chart:
    spec:
      chart: firefly-iii
      version: "1.10.1"
      sourceRef:
        kind: HelmRepository
        name: firefly-iii
  values:
    config:
      env:
        APP_URL: https://firefly.xgabrielmorales.com
        DB_CONNECTION: pgsql
        DB_HOST: firefly-db
        DB_PORT: "5432"
        TZ: America/Bogota
      envValueFrom:
        DB_USERNAME:
          secretKeyRef:
            name: firefly-secret
            key: FIREFLY_DB_USER
        DB_PASSWORD:
          secretKeyRef:
            name: firefly-secret
            key: FIREFLY_DB_PASSWORD
        DB_DATABASE:
          secretKeyRef:
            name: firefly-secret
            key: FIREFLY_DB_DBNAME
        APP_KEY:
          secretKeyRef:
            name: firefly-secret
            key: FIREFLY_APP_KEY
        APP_PASSWORD:
          secretKeyRef:
            name: firefly-secret
            key: FIREFLY_APP_PASSWORD
    persistence:
      enabled: true
      storageClassName: local-path
      size: 5Gi
    ingress:
      enabled: true
      className: traefik
      hosts:
        - firefly.xgabrielmorales.com
    resources:
      requests:
        memory: 160Mi
      limits:
        memory: 320Mi
