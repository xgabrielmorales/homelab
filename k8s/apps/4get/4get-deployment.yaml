apiVersion: apps/v1
kind: Deployment
metadata:
  name: fourget
  labels:
    app: fourget
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fourget
  template:
    metadata:
      labels:
        app: fourget
    spec:
      nodeSelector:
        kubernetes.io/hostname: xgm-hm
      enableServiceLinks: false
      containers:
        - name: fourget
          image: luuul/4get:1.0.61@sha256:a42c215ffed9fb9884c55f864f40a50a1651bc27b9d1213be2d090977c881612
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - SETUID
                - SETGID
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 80
          env:
            - name: TZ
              value: America/Bogota
            - name: FOURGET_PROTO
              value: http
            - name: FOURGET_SERVER_NAME
              value: 4get.xgabrielmorales.com
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 256Mi
