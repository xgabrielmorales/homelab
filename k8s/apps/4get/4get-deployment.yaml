apiVersion: apps/v1
kind: Deployment
metadata:
  name: fourget
  labels:
    app: fourget
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fourget
  template:
    metadata:
      labels:
        app: fourget
    spec:
      nodeSelector:
        kubernetes.io/hostname: xgm-hm
      enableServiceLinks: false
      containers:
        - name: fourget
          image: luuul/4get:1.0.64@sha256:c850fe1d48e19e45414a1bb419446f4ca7612fa44d35e03d0479f3723e1ef260
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - SETUID
                - SETGID
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 80
          env:
            - name: TZ
              value: America/Bogota
            - name: FOURGET_PROTO
              value: http
            - name: FOURGET_SERVER_NAME
              value: 4get.xgabrielmorales.com
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 256Mi
