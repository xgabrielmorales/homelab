apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tempo
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: tempo
      version: "3.2.1"
      sourceRef:
        kind: HelmRepository
        name: grafana-community
        namespace: monitoring
  values:
    tempo:
      retention: 168h
      reportingEnabled: false
      resources:
        requests:
          memory: 256Mi
        limits:
          memory: 768Mi
      extraEnv:
        - name: TZ
          value: America/Bogota
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
    persistence:
      enabled: true
      storageClassName: local-path
      size: 5Gi
    nodeSelector:
      kubernetes.io/hostname: xgm-hm
