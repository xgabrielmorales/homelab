apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-lan-devices
spec:
  podSelector:
    matchLabels:
      app: homeassistant
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 10.10.10.20/32
        - ipBlock:
            cidr: 10.10.10.21/32
