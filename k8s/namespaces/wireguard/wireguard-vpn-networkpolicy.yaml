apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-vpn
spec:
  podSelector:
    matchLabels:
      app: wireguard
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.42.0.0/16
      ports:
        - protocol: UDP
          port: 51820
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
