services:
  home-assistant:
    image: "ghcr.io/home-assistant/home-assistant:stable"
    container_name: home-assistant
    restart: unless-stopped
    network_mode: host
    environment:
      - TZ=America/Bogota
    volumes:
      - home-assistant-data:/config
      - ./config/configuration.yaml:/config/configuration.yaml

  matter-server:
    image: "ghcr.io/home-assistant-libs/python-matter-server:stable"
    container_name: matter-server
    restart: unless-stopped
    network_mode: host
    privileged: true
    security_opt:
      - apparmor:unconfined
    volumes:
      - matter-data:/data
      - /run/dbus:/run/dbus:ro
    environment:
      - TZ=America/Bogota

volumes:
  home-assistant-data:
  matter-data:
